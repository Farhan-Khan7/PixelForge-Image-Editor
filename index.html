<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelForge</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="style.css" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
  <header>
    <div class="container">
      <nav>
        <div class="logo">
          <img src="assets/dark-mode-logo.png" alt="" />
        </div>

        <div class="nav-links">
          <div class="import-image">
            <button id="upload-img" class="upload-btn">
              <label for="input-img" id="upload-label">Choose Image</label>
              <input type="file" id="input-img" hidden />
            </button>
          </div>
          <button id="reset-editing">Reset</button>
          <button id="download-img">Download</button>
          <button id="edit-img">Edit</button>
        </div>

        <div class="toggle"><i class="ri-sun-line"></i></div>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="workspace">
        <div class="image-preview">
          <i class="ri-image-ai-fill"></i>
          <p>Click "Choose Image"</p>
          <div class="show-img">
            <img src="" alt="" id="preview-image">
          </div>
        </div>


        <!-- EDITOR CONTROL PANEL -->
        <div class="editor-controls">
          <i class="ri-equalizer-line"></i>
          <p>Editor Panel</p>
          <div class="panels">
            <div class="control" id="brightness">
              <div class="control-header">
                <p>Brightness</p>
                <span class="value">100%</span>
              </div>
              <input type="range" min="0" max="200" value="100">
            </div>

            <div class="control" id="contrast">
              <div class="control-header">
                <p>Contrast</p>
                <span class="value">100%</span>
              </div>
              <input type="range" min="0" max="200" value="100">
            </div>

            <div class="control" id="saturation">
              <div class="control-header">
                <p>Saturation</p>
                <span class="value">100%</span>
              </div>
              <input type="range" min="0" max="200" value="100">
            </div>

            <div class="control" id="grayscale">
              <div class="control-header">
                <p>Grayscale</p>
                <span class="value">0%</span>
              </div>
              <input type="range" min="0" max="100" value="0">
            </div>

            <div class="control" id="sepia">
              <div class="control-header">
                <p>Sepia</p>
                <span class="value">0%</span>
              </div>
              <input type="range" min="0" max="100" value="0">
            </div>

            <div class="control" id="invert">
              <div class="control-header">
                <p>Invert</p>
                <span class="value">0%</span>
              </div>
              <input type="range" min="0" max="100" value="0">
            </div>

            <div class="control" id="blur">
              <div class="control-header">
                <p>Blur</p>
                <span class="value">0px</span>
              </div>
              <input type="range" min="0" max="20" value="0">
            </div>

            <div class="control" id="opacity">
              <div class="control-header">
                <p>Opacity</p>
                <span class="value">100%</span>
              </div>
              <input type="range" min="0" max="100" value="100">
            </div>

            <div class="control" id="hue-rotate">
              <div class="control-header">
                <p>Hue Rotate</p>
                <span class="value">0°</span>
              </div>
              <input type="range" min="0" max="360" value="0">
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>

</html>
